name: Build binaries
run-name: SysKline binaries · ${{ github.ref_name }}

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version label (default: dev-<commit>)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Native checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ''
          - os: macos-latest
            exe: ''
          - os: windows-latest
            exe: '.exe'
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: go mod verify
      - run: go test ./...
      - name: Race detector
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o bin/syskline${{ matrix.exe }} ./cmd/syskline
      - name: Demo terminal interactions
        if: runner.os != 'Windows'
        run: python scripts/smoke_tui.py
      - name: Live terminal interactions
        if: runner.os != 'Windows'
        run: python scripts/smoke_tui.py --live
      - name: Native system snapshot
        run: python scripts/check_snapshot.py bin/syskline${{ matrix.exe }}

  build:
    name: Package six platform binaries
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Resolve version
        id: meta
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "$MANUAL_VERSION" ]]; then
            version="$MANUAL_VERSION"
          else
            version="dev-${GITHUB_SHA:0:7}"
          fi
          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$ ]]; then
            echo 'Invalid version: use 1-64 letters, digits, dots, pluses or hyphens.' >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build and package static binaries
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/build.sh
      - name: Verify packages and checksums
        env:
          BUILD_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 scripts/verify_release.py dist "$BUILD_VERSION"
          ./dist/syskline-linux-amd64 --version
      - name: Upload downloadable binaries
        uses: actions/upload-artifact@v6
        with:
          name: syskline-${{ steps.meta.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Write download summary
        env:
          BUILD_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          printf '## SysKline %s\n\n' "$BUILD_VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf 'Download **syskline-%s** from this run’s **Artifacts** section.\n\n' "$BUILD_VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf 'Contains macOS / Linux / Windows amd64 and arm64 CGO-free binaries, tar.gz / zip installation packages and SHA256SUMS.\n' >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: syskline-${{ needs.build.outputs.version }}
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            notes="docs/release-notes/$RELEASE_TAG.md"
            if [[ -f "$notes" ]]; then
              gh release create "$RELEASE_TAG" dist/* --verify-tag --title "SysKline $RELEASE_TAG" --notes-file "$notes"
            else
              gh release create "$RELEASE_TAG" dist/* --verify-tag --title "SysKline $RELEASE_TAG" --generate-notes
            fi
          fi
